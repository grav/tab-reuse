name: Release extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          manifest_version="$(node -p "require('./manifest.json').version")"
          tag_version="${RELEASE_TAG#v}"

          if [ "$manifest_version" != "$tag_version" ]; then
            echo "manifest.json version ($manifest_version) does not match tag ($RELEASE_TAG)" >&2
            exit 1
          fi

      - name: Package extension
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          archive="tab-reuse-${RELEASE_TAG}.zip"
          mkdir -p dist
          zip -j "dist/$archive" \
            manifest.json \
            background.js \
            content.js \
            routing.js \
            README.md
          cd dist
          sha256sum "$archive" > "$archive.sha256"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/tab-reuse-${{ github.ref_name }}.zip \
            dist/tab-reuse-${{ github.ref_name }}.zip.sha256 \
            --generate-notes \
            --title "Tab Reuse ${{ github.ref_name }}"
