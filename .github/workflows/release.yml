name: Build and release extension

on:
  push:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          manifest_version="$(node -p "require('./manifest.json').version")"
          tag_version="${RELEASE_TAG#v}"

          if [ "$manifest_version" != "$tag_version" ]; then
            echo "manifest.json version ($manifest_version) does not match tag ($RELEASE_TAG)" >&2
            exit 1
          fi

      - name: Package extension
        id: package
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            build_id="$GITHUB_REF_NAME"
          else
            build_id="${GITHUB_SHA::7}"
          fi

          archive="tab-reuse-${build_id}.zip"
          mkdir -p dist
          zip -j "dist/$archive" \
            manifest.json \
            background.js \
            content.js \
            routing.js \
            README.md
          cd dist
          sha256sum "$archive" > "$archive.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tab-reuse-${{ github.sha }}
          path: dist/
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "dist/${{ steps.package.outputs.archive }}" \
            "dist/${{ steps.package.outputs.archive }}.sha256" \
            --generate-notes \
            --title "Tab Reuse ${{ github.ref_name }}"
