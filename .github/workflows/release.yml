name: Build and release extension

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          manifest_version="$(node -p "require('./manifest.json').version")"
          tag_version="${RELEASE_TAG#v}"

          if [ "$manifest_version" != "$tag_version" ]; then
            echo "manifest.json version ($manifest_version) does not match tag ($RELEASE_TAG)" >&2
            exit 1
          fi

      - name: Package extension
        id: package
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            build_id="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            build_id="latest"
          else
            build_id="${GITHUB_SHA::7}"
          fi

          archive="tab-reuse-${build_id}.zip"
          mkdir -p dist
          zip -j "dist/$archive" \
            manifest.json \
            background.js \
            content.js \
            routing.js \
            README.md
          cd dist
          sha256sum "$archive" > "$archive.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: tab-reuse-${{ github.sha }}
          path: dist/
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "dist/${{ steps.package.outputs.archive }}" \
            "dist/${{ steps.package.outputs.archive }}.sha256" \
            --generate-notes \
            --title "Tab Reuse ${{ github.ref_name }}"

      - name: Update latest prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          git tag --force latest "$GITHUB_SHA"
          git push --force origin refs/tags/latest

          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest \
              "dist/$ARCHIVE" \
              "dist/$ARCHIVE.sha256" \
              --clobber
            gh release edit latest \
              --prerelease \
              --title "Latest build" \
              --notes "Automated build of commit $GITHUB_SHA."
          else
            gh release create latest \
              "dist/$ARCHIVE" \
              "dist/$ARCHIVE.sha256" \
              --prerelease \
              --title "Latest build" \
              --notes "Automated build of commit $GITHUB_SHA."
          fi
